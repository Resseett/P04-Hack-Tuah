<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/components/pokedex_styles.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container login-container">
    <div class="card p-4 mb-4 rounded shadow mx-auto" style="max-width: 500px;">
      <h1 class="text-center gradient-text mb-4">Registro de Usuario</h1>
      <form id="signupForm">
        <div class="mb-3">
          <label for="newUser" class="form-label w-100">Usuario:</label>
          <input type="text" id="newUser" name="newUser" class="form-control w-100" required>
        </div>
        <div class="mb-3">
          <label for="newPass" class="form-label w-100">Contraseña:</label>
          <input type="password" id="newPass" name="newPass" class="form-control w-100" required>
        </div>
        <button type="submit" class="btn btn-login w-100">
          Registrarse
        </button>
      </form>
      <div id="signupMessage" class="text-center mt-3"></div>
    </div>
  </div>  

  <script src="/js/signup.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
  <div id="toast-root"></div>
</body>
</html>
