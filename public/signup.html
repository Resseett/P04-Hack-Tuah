<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center text-primary">Registro de Usuario</h1>
    <form id="signupForm" class="w-50 mx-auto">
      <div class="mb-3">
        <label for="newUser" class="form-label">Nombre de usuario:</label>
        <input type="text" id="newUser" name="newUser" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="newPass" class="form-label">Contraseña:</label>
        <input type="password" id="newPass" name="newPass" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>
    <div id="signupMessage" class="text-center mt-3"></div>
  </div>

  <script>
    const form = document.getElementById("signupForm");
    const msg = document.getElementById("signupMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("newUser").value;
      const password = document.getElementById("newPass").value;

      const res = await fetch("/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });

      const data = await res.json();

      msg.textContent = data.message;
      msg.classList.toggle("text-success", data.success);
      msg.classList.toggle("text-danger", !data.success);

      if (data.success) {
        setTimeout(() => {
          window.location.href = "/login";
        }, 1500);
      }
    });
  </script>
</body>
</html>
