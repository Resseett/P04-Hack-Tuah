<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario de Cartas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/components/pokedex_styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container mt-5">
    <h1>Mi Inventario de Cartas</h1>

    <div class="mb-4">
      <input type="text" id="cardIdInput" class="form-control" placeholder="ID de carta (ej. xy7-54)">
      <button id="addCardBtn" class="btn btn-success mt-2">Añadir al Inventario</button>
    </div>

    <div id="inventoryContainer" class="row row-cols-1 row-cols-md-3 g-4"></div>
  </main>

  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/inventory.js"></script>
  <div id="toast-root"></div> 

<!-- Modal Detalle de Carta -->
<div class="modal fade" id="detalleCartaModal" tabindex="-1" aria-labelledby="detalleCartaLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="detalleCartaLabel">Detalle de Carta</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="detalleCartaBody">
        <!-- Aquí se cargan los datos dinámicamente -->
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
