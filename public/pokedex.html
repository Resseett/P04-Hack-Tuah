<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex - Pókedex de Cartas de Pokémon</title>
  <style>
    /* Estilos básicos */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    nav {
      background-color: #333;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .nav-links {
      display: flex;
    }
    main {
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">
      <a href="/pokedex">Pokedex</a>
    </div>
    <div class="nav-links">
      <a href="/upload">Escanear Cartas</a>
      <a href="/inventory">Inventario</a>
      <a href="/trade">Intercambio</a>
      <a href="/stats">Estadísticas</a>
      <a href="/login">Ir a Login</a>
    </div>
  </nav>
  <main>
    <h1>Pokedex</h1>
    <p>Aquí puedes explorar todas las cartas de Pokémon disponibles.</p>
  
    <input type="text" id="cardId" placeholder="Ingresa ID de carta (ej: xy7-54)" />
    <button onclick="buscarCarta()">Buscar Carta</button>
  
    <div id="resultado"></div>
  </main>
  
  <script src="/js/script.js"></script>
  
</body>
</html>
