<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/components/styles.css">
    <style>
        /* Estilos básicos para la barra de navegación */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="navbar"></div> <!-- Aquí se cargará la navbar -->
    
    <div class="container mt-5">
        <h1 class="text-center text-primary">Iniciar Sesión</h1>
        <form class="w-50 mx-auto">
            <div class="mb-3">
                <label for="user" class="form-label">Usuario:</label>
                <input type="text" id="user" name="user" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Ingresar</button>
        </form>
        <p class="text-center mt-3">
            <a href="/" class="btn btn-link">Volver al Inicio</a>
        </p>
    </div>
</body>
</html>

<script>
    // Cargar la navbar desde navbar.html
    fetch('/components/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar').innerHTML = data;
      })
      .catch(error => console.error('Error al cargar la navbar:', error));
  </script>
