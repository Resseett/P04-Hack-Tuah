<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/components/pokedex_styles.css">
</head>
<body>
    <div id="navbar"></div> 
    <div class="container login-container">
        <div class="card p-4 shadow mx-auto" style="max-width: 500px;">
          <h1 class="text-center gradient-text mb-4">Iniciar Sesión</h1>
          <form>
            <div class="mb-3">
              <label for="user" class="form-label w-100">Usuario:</label>
              <input type="text" id="user" name="user" class="form-control w-100" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label w-100">Contraseña:</label>
              <input type="password" id="password" name="password" class="form-control w-100" required>
            </div>
            <button type="submit" class="btn btn-login w-100">Ingresar</button>
          </form>
          <div class="text-center mt-3">
            <span>¿No tienes cuenta? </span>
            <a href="/signup" class="btn btn-link">Regístrate aquí</a>
          </div>                  
        </div>
      </div>

    <script src="/js/login.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
