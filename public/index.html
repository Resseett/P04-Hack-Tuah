<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Home - Pókedex de Cartas de Pokémon</title>
  <style>
    /* Estilos básicos */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    nav {
      background-color: #333;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .nav-links {
      display: flex;
    }
    main {
      text-align: center;
      margin-top: 50px;
    }
    #userStatus {
      margin-bottom: 20px;
    }
    #logoutBtn {
      display: none;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">
      <a href="/pokedex">Pokedex</a>
    </div>
    <div class="nav-links">
      <a href="/upload">Escanear Cartas</a>
      <a href="/inventory">Inventario</a>
      <a href="/trade">Intercambio</a>
      <a href="/stats">Estadísticas</a>
      <a href="/login" id="loginBtn">Ir a Login</a>
      <button id="logoutBtn">Salir</button>
    </div>
  </nav>
  <main>
    <h1>Bienvenido a la Pókedex de Cartas de Pokémon</h1>
    <p>Explora, organiza y gestiona tu colección de cartas de Pokémon.</p>
    <p id="userStatus">Cargando...</p>
  
    <div class="d-flex justify-content-center gap-3 mt-5">
      <a href="/login" class="btn btn-primary btn-lg">Iniciar Sesión</a>
      <a href="/signup" class="btn btn-secondary btn-lg">Registrarse</a>
    </div>
  </main>  
  <script src="/js/auth.js"></script>
</body>
</html>
