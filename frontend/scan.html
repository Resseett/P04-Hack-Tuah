<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escanear Cartas</title>
  <link rel="stylesheet" href="/components/pokedex_styles.css">
  <link rel="stylesheet" href="/components/scan_styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main>
    <h1 class="gradient-text">Escanear Cartas</h1>
    <p>Sube una imagen de una carta para comenzar el escaneo.</p>

    <div class="scan-container">
      <input type="file" id="imageInput" accept="image/*" />
      <img id="imagePreview" class="preview-img" style="display:none;" />
      <div id="scanResult" class="scan-result-box"></div>
    </div>
  </main>

  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
  <script type="module" src="/js/scan.js"></script>
</body>
</html>
