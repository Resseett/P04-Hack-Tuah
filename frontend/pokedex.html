<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex - Pókedex de Cartas de Pokémon</title>
  <link rel="stylesheet" href="/components/pokedex_styles.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <h1>Pokedex</h1>
    <p>Aquí puedes explorar todas las cartas de Pokémon disponibles.</p>
    <p id="welcomeText">¿Qué carta buscas hoy día?</p>

    <!-- Filtros de búsqueda -->
    <div id="filtros" style="margin-bottom: 20px;">
      <label for="setSelect"><strong>Filtrar por set:</strong></label>
      <select id="setSelect">
        <option value="">Todos los sets</option>
      </select>
      <label for="supertypeSelect"><strong>Tipo de carta:</strong></label>
    <select id="supertypeSelect">
      <option value="">Todos</option>
    </select>

    <label for="subtypeSelect"><strong>Subtipo:</strong></label>
    <select id="subtypeSelect">
      <option value="">Todos</option>
    </select>

    <label for="typeSelect"><strong>Tipo:</strong></label>
    <select id="typeSelect">
      <option value="">Todos</option>
    </select>
    
    <label for="raritySelect"><strong>Rareza:</strong></label>
    <select id="raritySelect">
      <option value="">Todas</option>
    </select>
    </div>

    <input type="text" id="cardId" placeholder="Ingresa el nombre de la carta" />
    <button onclick="buscarCarta()">Buscar Carta</button>
    <div id="resultado"></div>
  </main>
  
  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const resultsDiv = document.getElementById('resultado');
      const searchResults = JSON.parse(sessionStorage.getItem('searchResults'));

      if (searchResults && searchResults.length > 0) {
        searchResults.forEach(carta => {
          const cartaDiv = document.createElement('div');
          cartaDiv.className = 'carta';

          cartaDiv.innerHTML = `
            <h3>${carta.name}</h3>
            <img src="${carta.images.large}" alt="${carta.name}" />
            <p><strong>Tipo:</strong> ${carta.types?.join(", ") || "Desconocido"}</p>
            <p><strong>Precio:</strong> 
              ${
                carta.tcgplayer?.prices?.normal?.market
                  ? `$${carta.tcgplayer.prices.normal.market.toFixed(2)}`
                  : "No disponible"
              }
            </p>
            <button id="add-${carta.id}" class="btn btn-success mt-2" onclick="agregarAlInventario('${carta.id}')">
              ➕ Agregar al Inventario
            </button>
          `;

          resultsDiv.appendChild(cartaDiv);
        });
      } else {
        resultsDiv.innerHTML = "<p>❌ No se encontraron resultados.</p>";
      }
    });

// Llenar los selects al cargar la página
    document.addEventListener('DOMContentLoaded', async () => {
      const setSelect = document.getElementById('setSelect');
      const subtypeSelect = document.getElementById('subtypeSelect');
      const raritySelect = document.getElementById('raritySelect');
      const supertypeSelect = document.getElementById('supertypeSelect');
      const typeSelect = document.getElementById('typeSelect');
    
      try {
        // Llenar sets
        const setRes = await fetch('https://api.pokemontcg.io/v2/sets');
        const setData = await setRes.json();
        if (setData?.data?.length > 0) {
          setData.data.forEach(set => {
            const option = document.createElement('option');
            option.value = set.id;
            option.textContent = `${set.name} (${set.id})`;
            setSelect.appendChild(option);
          });
        }
      
        // Llenar subtipos
        const subtypeRes = await fetch('https://api.pokemontcg.io/v2/subtypes');
        const subtypeData = await subtypeRes.json();
        if (subtypeData?.data?.length > 0) {
          subtypeData.data.forEach(sub => {
            const option = document.createElement('option');
            option.value = sub;
            option.textContent = sub;
            subtypeSelect.appendChild(option);
          });
        }
      
        // Llenar rarezas
        const rarityRes = await fetch('https://api.pokemontcg.io/v2/rarities');
        const rarityData = await rarityRes.json();
        if (rarityData?.data?.length > 0) {
          rarityData.data.forEach(r => {
            const option = document.createElement('option');
            option.value = r;
            option.textContent = r;
            raritySelect.appendChild(option);
          });
        }
      
        // Llenar tipos de carta (Pokémon, Entrenador, Energía)
        const supertypes = ['Pokémon', 'Trainer', 'Energy'];
        supertypes.forEach(type => {
          const option = document.createElement('option');
          option.value = type;
          option.textContent = type;
          supertypeSelect.appendChild(option);
        });

        const typesRes = await fetch('https://api.pokemontcg.io/v2/types');
        const typesData = await typesRes.json();
        if (typesData?.data?.length > 0) {
          typesData.data.forEach(t => {
            const option = document.createElement('option');
            option.value = t;
            option.textContent = t;
            typeSelect.appendChild(option);
          });
        }
      
      } catch (err) {
        console.error('Error al llenar los selects:', err);
      }
    });
  </script>  
</body>
</html>
