<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex - Pókedex de Cartas de Pokémon</title>
  <link rel="stylesheet" href="/components/pokedex_styles.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <h1>Pokedex</h1>
    <p>Aquí puedes explorar todas las cartas de Pokémon disponibles.</p>
    <p id="welcomeText">¿Qué carta buscas hoy día?</p>

    <!-- Filtros de búsqueda -->
    <div id="filtros" style="margin-bottom: 20px;">
      <label for="setSelect"><strong>Filtrar por set:</strong></label>
      <select id="setSelect">
        <option value="">Todos los sets</option>
      </select>
    </div>

    <input type="text" id="cardId" placeholder="Ingresa el nombre de la carta" />
    <button onclick="buscarCarta()">Buscar Carta</button>
    <div id="resultado"></div>
  </main>
  
  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const resultsDiv = document.getElementById('resultado');
      const searchResults = JSON.parse(sessionStorage.getItem('searchResults'));

      if (searchResults && searchResults.length > 0) {
        searchResults.forEach(carta => {
          const cartaDiv = document.createElement('div');
          cartaDiv.className = 'carta';

          cartaDiv.innerHTML = `
            <h3>${carta.name}</h3>
            <img src="${carta.images.large}" alt="${carta.name}" />
            <p><strong>Tipo:</strong> ${carta.types?.join(", ") || "Desconocido"}</p>
            <p><strong>Precio:</strong> 
              ${
                carta.tcgplayer?.prices?.normal?.market
                  ? `$${carta.tcgplayer.prices.normal.market.toFixed(2)}`
                  : "No disponible"
              }
            </p>
            <button id="add-${carta.id}" class="btn btn-success mt-2" onclick="agregarAlInventario('${carta.id}')">
              ➕ Agregar al Inventario
            </button>
          `;

          resultsDiv.appendChild(cartaDiv);
        });
      } else {
        resultsDiv.innerHTML = "<p>❌ No se encontraron resultados.</p>";
      }
    });

    // Llenar el select de sets al cargar la página
    document.addEventListener('DOMContentLoaded', async () => {
      // Obtener sets de la API y llenar el select
      const setSelect = document.getElementById('setSelect');
      try {
        const res = await fetch('https://api.pokemontcg.io/v2/sets');
        const data = await res.json();
        if (data?.data?.length > 0) {
          data.data.forEach(set => {
            const option = document.createElement('option');
            option.value = set.id;
            option.textContent = `${set.name} (${set.id})`;
            setSelect.appendChild(option);
          });
        }
      } catch (err) {
        // Si falla, deja solo la opción por defecto
      }
    });
  </script>  
</body>
</html>
