<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intercambios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/components/pokedex_styles.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="container mt-5">
        <h1 class="mb-4">Centro de Intercambios</h1>

        <div class="row">
            <!-- Columna para tus cartas ofrecidas -->
            <div class="col-md-6">
                <h4>Cartas que ofreces para intercambiar</h4>
                <p class="text-muted">Puedes marcar cartas como intercambiables desde tu inventario.</p>
                <div id="myTradableCardsContainer" class="row row-cols-2 row-cols-lg-3 g-3">
                    <!-- Tus cartas intercambiables se cargarán aquí -->
                </div>
            </div>

            <!-- Columna para tus cartas buscadas (Wishlist) -->
            <div class="col-md-6">
                <h4>Cartas que buscas (Wishlist)</h4>
                <div class="input-group mb-3">
                    <input type="text" id="wishlistCardInput" class="form-control" placeholder="ID de la carta (ej: sv3-151)">
                    <button class="btn btn-primary" type="button" id="addWishlistBtn">Añadir a la Wishlist</button>
                </div>
                <div id="wishlistContainer" class="row row-cols-2 row-cols-lg-3 g-3">
                    <!-- Tu wishlist se cargará aquí -->
                </div>
            </div>
        </div>
    </main>

    <script src="/js/navbar.js"></script>
    <script src="/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/trade.js"></script>
</body>
</html>
