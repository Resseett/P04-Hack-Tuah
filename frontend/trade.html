<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Intercambio</title>

  <!-- Bootstrap y estilos personalizados -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/components/pokedex_styles.css"/>
</head>
<body>
  <!-- Navbar cargado dinámicamente -->
  <div id="navbar"></div>

  <!-- Contenido principal -->
  <div class="container mt-5">
    <div class="card shadow p-4">
      <h1 class="text-center gradient-text mb-4">Cartas que quiero intercambiar</h1>

      <!-- Formulario para agregar carta -->
      <div class="mb-3">
        <label for="wantedCardId" class="form-label">ID de la carta deseada:</label>
        <input type="text" id="wantedCardId" class="form-control" placeholder="Ej: xy7-54">
        <button class="btn btn-primary mt-2 w-100" onclick="agregarCartaDeseada()">Agregar a la colección</button>
      </div>

      <!-- Lista de cartas deseadas -->
      <h4 class="mt-4">Mi colección de cartas buscadas:</h4>
      <div id="coleccionContainer" class="row g-3 mt-2"></div>
      <h4 class="mt-5">Cartas que tengo disponibles para intercambiar:</h4>
      <div id="cartasIntercambiablesContainer" class="row g-3 mt-2"></div>
    </div>
  </div>

  

  <!-- Scripts -->
  <script src="/js/trade.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
  <div id="toast-root"></div>
</body>
</html>
