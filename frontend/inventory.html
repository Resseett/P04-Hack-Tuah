<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario y Mazos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/components/pokedex_styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container-fluid mt-4">
    <ul class="nav nav-tabs" id="inventoryTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="inventory-tab" data-bs-toggle="tab" data-bs-target="#inventory-panel" type="button" role="tab">Inventario</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="deck-tab" data-bs-toggle="tab" data-bs-target="#deck-panel" type="button" role="tab">Constructor de Mazo</button>
      </li>
    </ul>

    <div class="tab-content pt-4">
      <!-- Panel de Inventario -->
      <div class="tab-pane fade show active" id="inventory-panel" role="tabpanel">
        <div class="row g-3 align-items-center mb-4 p-3 bg-light rounded border">
            <div class="col-md-3"><input type="text" id="nameSearchInput" class="form-control" placeholder="Buscar por nombre..."></div>
            <div class="col-md-2"><select id="typeFilter" class="form-select"><option value="">Todos los Tipos</option></select></div>
            <div class="col-md-2"><select id="setFilter" class="form-select"><option value="">Todos los Sets</option></select></div>
            <div class="col-md-2"><select id="rarityFilter" class="form-select"><option value="">Todas las Rarezas</option></select></div>
            <div class="col-md-1"><div class="form-check form-switch pt-2"><input class="form-check-input" type="checkbox" role="switch" id="favoritesFilter"><label class="form-check-label" for="favoritesFilter">Favs</label></div></div>
            <div class="col-md-2"><button class="btn btn-secondary w-100" id="statsBtn">Estadísticas</button></div>
        </div>
        <div id="inventoryContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 row-cols-lg-5 g-4"></div>
      </div>

      <!-- Panel de Constructor de Mazo (NUEVA ESTRUCTURA) -->
      <div class="tab-pane fade" id="deck-panel" role="tabpanel">
        <div class="row">
          <!-- Columna Izquierda: Inventario para añadir -->
          <div class="col-md-8">
            <h4>Tus Cartas Disponibles</h4>
            <div id="deckBuilderInventoryContainer" class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-2" style="max-height: 80vh; overflow-y: auto;">
              <!-- Las cartas del inventario se renderizarán aquí -->
            </div>
          </div>
          <!-- Columna Derecha: Mazo actual y guardados -->
          <div class="col-md-4">
            <h4>Mazo Actual</h4>
            <div class="card mb-3">
              <div class="card-body">
                <h5 id="currentDeckName" class="card-title">Nuevo Mazo</h5>
                <p id="deckCounter" class="card-text"><strong>Cartas:</strong> 0/60</p>
                <button class="btn btn-success" onclick="saveDeckWithName()">💾 Guardar Mazo</button>
                <button class="btn btn-warning" onclick="clearDeck()">Limpiar Mazo</button>
              </div>
            </div>
            <div id="deckContainer" class="list-group mb-4" style="max-height: 40vh; overflow-y: auto;">
              <!-- Las cartas añadidas al mazo aparecerán aquí -->
            </div>
            
            <h4>Mazos Guardados</h4>
            <div id="savedDecksContainer" class="list-group">
              <!-- Los mazos guardados se listarán aquí -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/inventory.js"></script>

  <!-- Modales (sin cambios) -->
  <div class="modal fade" id="cardDetailsModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="modalBody"></div></div></div></div>
  <div class="modal fade" id="statsModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Estadísticas</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="statsModalBody"></div></div></div></div>
</body>
</html>
