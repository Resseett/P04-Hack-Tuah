<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario de Cartas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/components/pokedex_styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container mt-5">
    <h1>Tu Inventario de Cartas</h1>

    <ul class="nav nav-tabs mt-4" id="inventoryTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="inventory-tab" data-bs-toggle="tab" data-bs-target="#inventory-panel" type="button" role="tab">Inventario</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="deck-tab" data-bs-toggle="tab" data-bs-target="#deck-panel" type="button" role="tab">Constructor de Mazo</button>
      </li>
    </ul>

    <div class="mb-4">
      <div>
        <input type="text" id="cardIdInput" class="form-control" placeholder="ID de carta (ej. xy7-54)">
        <button id="addCardBtn" class="btn btn-success mt-2">Añadir al Inventario</button>
      </div>
      <div class="text-end my-4">
        <button id="statsBtn" class="btn btn-info">Ver Estadísticas</button>
      </div>
    </div>

    <div class="btn-group mb-4" role="group" aria-label="Ordenar por">
  <button type="button" class="btn btn-outline-primary" onclick="ordenarInventario('name')">Nombre</button>
  <button type="button" class="btn btn-outline-primary" onclick="ordenarInventario('rarity')">Rareza</button>
  <button type="button" class="btn btn-outline-primary" onclick="ordenarInventario('set')">Set</button>
</div>



    <div class="tab-content mt-4">
      <!-- Panel de Inventario -->
      <div class="tab-pane fade show active" id="inventory-panel" role="tabpanel">
        <div id="inventoryContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 justify-content-center"></div>
      </div>

      <!-- Panel de Mazo -->
      <div class="tab-pane fade" id="deck-panel" role="tabpanel">
        <h3>Tu Mazo (máximo 60 cartas)</h3>
        <!-- Contador y botón Guardar -->
        <div class="d-flex justify-content-between align-items-center mt-3">
          <p id="deckCounter" class="mb-0"><strong>Cartas en el mazo:</strong> 0/60</p>
          <button class="btn btn-success" onclick="saveDeckWithName()">
            💾 Guardar mazo
          </button>
        </div>

        <!-- Nombre del mazo actual -->
        <h4 id="currentDeckName" class="badge bg-secondary fs-6 mt-2">
          Nuevo Mazo
        </h4>

        <!-- Aquí se renderizan las cartas del mazo -->
        <div id="deckContainer" class="row g-3"></div>

        <!-- Lista de mazos guardados -->
        <h5 class="mt-4">Mazos Guardados</h5>
        <div id="savedDecksContainer" class="row g-3"></div>
      </div>
    </div>

  </main>

  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/inventory.js"></script>
  <div id="toast-root"></div> 

<!-- Modal de estadísticas -->
    <div class="modal fade" id="statsModal" tabindex="-1" aria-labelledby="statsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="statsModalLabel">Estadísticas del Inventario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <ul class="nav nav-tabs" id="statsTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="types-tab" data-bs-toggle="tab" data-bs-target="#types" type="button" role="tab">Por Tipo</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="sets-tab" data-bs-toggle="tab" data-bs-target="#sets" type="button" role="tab">Por Set</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="rarity-tab" data-bs-toggle="tab" data-bs-target="#rarity" type="button" role="tab">Por Rareza</button>
              </li>
            </ul>
            <div class="tab-content mt-3">
              <div class="tab-pane fade show active" id="types" role="tabpanel">
                <div id="typesStats"></div>
              </div>
              <div class="tab-pane fade" id="sets" role="tabpanel">
                <div id="setsStats"></div>
              </div>
              <div class="tab-pane fade" id="rarity" role="tabpanel">
                <div id="rarityStats"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

<!-- Modal Detalle de Carta -->
<div class="modal fade" id="detalleCartaModal" tabindex="-1" aria-labelledby="detalleCartaLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="detalleCartaLabel">Detalle de Carta</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="detalleCartaBody">
        <!-- Aquí se cargan los datos dinámicamente -->
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
